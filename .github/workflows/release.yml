name: Release Windows player

on:
  push:
    tags:
      - 'v**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2022
    env:
      RUSTUP_TOOLCHAIN: 1.75.0-x86_64-pc-windows-msvc
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the release Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - name: Build and verify the portable ZIP
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/AC8音乐播放器-无游戏音频-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Read release notes from the annotated tag
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [[ $(jq -r '.object.type' <<< "$ref") == tag ]]; then
            sha=$(jq -r '.object.sha' <<< "$ref")
            body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" | jq -c '.message | rtrimstr("\n")')
            echo "body=$body" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the ZIP to the tagged release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ fromJSON(steps.notes.outputs.body || '""') }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: ${{ !steps.notes.outputs.body }}
