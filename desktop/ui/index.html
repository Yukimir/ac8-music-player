<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ACE COMBAT 8 · MUSIC PLAYER</title>
  <link rel="stylesheet" href="player.css">
  <script defer src="spectral-field.js"></script><script defer src="terrain-camera.js"></script><script defer src="terrain-points.js"></script><script defer src="terrain.js"></script>
  <script defer src="meters.js"></script><script defer src="arrangements.js"></script><script defer src="playlist.js"></script><script defer src="library-import.js"></script><script defer src="player.js"></script>
</head>
<body>
  <canvas id="terrain" aria-hidden="true"></canvas>
  <dialog id="closePrompt" aria-labelledby="closeTitle">
    <h2 id="closeTitle">关闭播放器？</h2>
    <p>隐藏到托盘后，音乐和桌面背景会继续运行。</p>
    <form method="dialog" class="source-actions">
      <button value="cancel">取消</button><button value="exit">退出播放器</button>
      <button value="hide" class="primary" autofocus>隐藏到托盘</button>
    </form>
  </dialog>
  <dialog id="libraryImport" aria-labelledby="importTitle">
    <h2 id="importTitle">音频来源</h2>
    <form id="importForm">
      <label for="importPath">ACE COMBAT 8 安装目录</label>
      <div class="import-path"><input id="importPath" type="text" spellcheck="false" placeholder="选择或粘贴游戏目录"><button id="importBrowse" type="button">浏览…</button></div>
      <fieldset class="source-options"><legend>读取方式</legend>
        <label><input type="radio" id="readDirect" name="readMode" checked>直接读取游戏文件</label>
        <label><input type="radio" id="readExtract" name="readMode">提取到播放器目录</label>
        <label class="native-option"><input type="checkbox" id="extractNative" disabled>同时提取原生 7.1.4 素材</label>
      </fieldset>
      <p id="importInfo"></p>
      <progress id="importProgress" hidden></progress>
      <p id="importMessage" role="status"></p>
      <div class="source-actions"><button id="importCancel" type="button" hidden>取消</button><button id="importStart" class="primary" type="submit">进入播放器</button></div>
    </form>
  </dialog>
  <div class="shell">
    <header><h1>MUSIC PLAYER</h1>
      <div class="header-right"><span class="game">ACE COMBAT <b>8</b></span><span class="vline"></span>
        <label class="vol" title="总音量"><span aria-hidden="true">◖))</span><span class="sr">总音量</span><input id="volume" type="range" min="0" max="100" value="65"></label>
        <button id="sourceSettings" class="header-icon" type="button" title="音频来源设置" aria-label="音频来源设置" aria-haspopup="dialog" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.2 2.5h3.6l.5 2.3 1.6.7 2-1.3 2.6 2.6-1.3 2 .7 1.6 2.1.5v3.4l-2.2.5-.7 1.6 1.3 2-2.6 2.6-2-1.3-1.6.7-.5 2.1h-3.4l-.5-2.2-1.6-.7-2 1.3-2.6-2.6 1.3-2-.7-1.6-2.2-.5v-3.4l2.3-.5.7-1.6-1.3-2 2.6-2.6 2 1.3 1.6-.7z"/><circle cx="12" cy="12" r="3.2"/></svg>
        </button>
        <button id="wallpaperMode" class="header-icon" type="button" title="设为桌面背景" aria-label="桌面背景" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3.5" width="20" height="14" rx="1.7"/><path d="m4 15 5-5 3 3 3.5-4 4.5 6M12 17.5V21m-4 0h8"/></svg>
        </button>
        <button id="cameraMode" class="header-icon" type="button" title="开启随机运镜" aria-label="随机运镜" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="13" height="12" rx="2"/><path d="m15.5 9 5.5-3v11l-5.5-3"/><path class="camera-play" d="m7.4 9 4 2.5-4 2.5z"/></svg>
        </button>
        <button id="toggleUi" class="header-icon" type="button" title="隐藏界面" aria-label="隐藏界面" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g class="eye-open"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g>
            <g class="eye-off"><path d="m3 3 18 18M9.5 5.4A9 9 0 0 1 12 5c6.4 0 10 7 10 7a21 21 0 0 1-3.2 4M6.1 6.9A21 21 0 0 0 2 12s3.6 7 10 7a12 12 0 0 0 5.1-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></g>
          </svg>
        </button>
      </div>
    </header>
    <main>
      <nav aria-label="曲库">
        <div class="navtop"><label class="category"><span class="filter-icon" aria-hidden="true"></span>
          <select aria-label="曲库分类" id="filter"><option>互动配乐</option><option value="单段配乐">单曲</option><option value="playlist">播放列表</option></select></label>
          <span id="total" class="mono"></span></div>
        <label class="search"><i aria-hidden="true"></i><input type="search" id="query" placeholder="搜索曲名或出处" aria-label="搜索曲名或出处"><kbd>/</kbd></label>
        <div id="list" role="listbox" aria-label="选曲" tabindex="0"></div>
        <p id="empty" hidden>没有匹配的曲目</p>
        <div id="catalogActions" class="list-actions" hidden>
          <select id="addPlan" aria-label="要加入播放列表的编排"></select>
          <button id="addEntry" type="button">＋ 加入播放列表</button>
        </div>
        <div id="playlistActions" class="list-actions" hidden>
          <button id="startList" type="button" class="primary">播放列表</button>
          <select id="listMode" aria-label="列表播放模式"></select>
          <button id="moveUp" type="button" aria-label="将选中条目上移">上移</button>
          <button id="moveDown" type="button" aria-label="将选中条目下移">下移</button>
          <button id="removeEntry" type="button">移除</button>
        </div>
        <p id="listNotice" role="status"></p>
      </nav>
      <section id="right" aria-label="播放控制">
        <article id="now"><div class="headings"><h2 id="title">正在读取曲库</h2><p id="origin"></p><p id="other" hidden></p></div>
          <div class="meterbox"><canvas id="spectrum" aria-label="实时音频频谱"></canvas></div>
          <input id="seek" type="range" min="0" max="10000" value="0" aria-label="段落播放位置">
          <div class="timing mono"><span id="time">00:00</span><span id="duration">00:00</span></div>
          <div class="transport"><button class="primary" id="play" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="play-mark" d="M6 4.5a.9.9 0 0 1 1.4-.76l12 7.5a.9.9 0 0 1 0 1.52l-12 7.5A.9.9 0 0 1 6 19.5Z"/><g class="pause-mark"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></g></svg>
              <span id="playText">播放</span></button>
            <button class="icon" id="previous" title="上一首（A）" aria-label="上一首" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="3" height="16" rx=".8"/><path d="M20 4.6a.8.8 0 0 0-1.24-.67L8 11.33a.8.8 0 0 0 0 1.34l10.76 7.4A.8.8 0 0 0 20 19.4Z"/></svg></button>
            <button class="icon" id="following" title="下一首（D）" aria-label="下一首" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="17" y="4" width="3" height="16" rx=".8"/><path d="M4 4.6a.8.8 0 0 1 1.24-.67L16 11.33a.8.8 0 0 1 0 1.34l-10.76 7.4A.8.8 0 0 1 4 19.4Z"/></svg></button>
            <button class="order" id="order" title="切换播放模式（T）：顺序播放 / 随机播放 / 单曲循环">顺序播放</button>
            <span id="load" role="status"></span>
          </div>
          <div class="cockpit-controls" role="group" aria-label="座舱音效">
            <label class="effects-switch"><input type="checkbox" id="effects" role="switch">随机音效</label>
            <button id="chooseEffects" type="button" aria-expanded="false" aria-controls="effectCategories" disabled>音效类别 <span id="effectCount">7/7</span></button>
            <label class="effects-switch" title="巡航时推力缓慢变化，开启随机告警后会随警报起伏"><input type="checkbox" id="engineBed" role="switch">发动机底噪</label>
            <label class="vol se-volume"><span>SE 音量</span><input id="seVolume" type="range" min="0" max="100" value="50" aria-label="SE 音量"><output id="seLevel" for="seVolume">50%</output></label>
          </div>
          <fieldset id="effectCategories" aria-label="随机播放的音效类别" hidden>
            <label><input type="checkbox" value="missile" checked>导弹来袭</label>
            <label><input type="checkbox" value="launch" checked>发射导弹</label>
            <label><input type="checkbox" value="gun" checked>机炮射击</label>
            <label><input type="checkbox" value="railgun" checked>轨道炮告警</label>
            <label><input type="checkbox" value="pull_up" checked>拉起告警</label>
            <label><input type="checkbox" value="stall" checked>失速告警</label>
            <label title="穿过云层时音乐渐闷，出云后恢复"><input type="checkbox" value="cloud" checked>过云</label>
          </fieldset>
        </article>
        <section class="pane phases"><div class="pane-head"><h3>段落</h3><span id="phaseStatus" aria-live="polite"></span>
          <button id="nextPhase" title="按当前音乐规则切至下一段">下一段 <b>›</b></button></div>
          <div id="sections" aria-label="选择段落" title="单击排队，双击立即切换"></div>
          <div class="settings"><label>循环次数 <select id="repeat" aria-label="循环次数"></select></label>
            <label>每遍长度 <select id="bars" aria-label="每遍长度"></select></label>
            <button id="reset">还原预设</button></div>
          <p class="section-help">单击排队 · 双击立即切换</p>
        </section>
        <section class="pane tracks"><div class="pane-head"><h3>分轨</h3><span id="laneCount"></span><span id="loopInfo" class="mono"></span></div>
          <div id="lanes" aria-label="分轨开关和时间线"></div>
        </section>
        <section id="arrangements" class="pane arr" aria-label="编排" hidden>
          <div class="pane-head"><h3>编排</h3><span id="arrPosition" class="mono"></span><button id="arrNew">新建</button></div>
          <div id="arrList" role="group" aria-label="选择编排"></div>
          <div id="arrPreview"></div>
          <div id="arrEditor"></div>
          <p id="arrNotice" role="status" hidden></p>
        </section>
        <p id="error" role="alert" hidden></p>
      </section>
    </main>
    <footer><span><kbd>↑</kbd><kbd>↓</kbd> 选曲</span><span>双击或 <kbd>Enter</kbd> 播放选曲</span><span><kbd>Space</kbd> 暂停 / 继续</span><span><kbd>R</kbd> 段落循环</span><span><kbd>T</kbd> 播放模式</span><span><kbd>1</kbd><kbd>3</kbd> 后退 / 快进</span>
    <span class="outfmt"><span id="audioFormat">等待音源</span> <i></i> <span id="outputLayout">自动</span></span></footer>
  </div>
</body></html>
